# 静态站点。进程以 uid 101 监听 8080（nginxinc/nginx-unprivileged）。
# 本文件替换镜像自带的 default.conf，入口脚本因此不会再改写监听地址。
# 只监听 IPv4：未开启 IPv6 的环境里，listen [::] 会让 nginx 启动失败。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        charset off;
        return 200 "ok\n";
    }

    # location 里一旦出现 add_header，就不再继承 server 层的响应头，所以要再 include 一次。
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }

    # 没有客户端路由，未知路径返回 404，不回落到首页。
    location / {
        try_files $uri $uri/ =404;
    }
}
